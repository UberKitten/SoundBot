<!DOCTYPE html>
<html lang="en-US">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>soundboard</title>
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="preconnect" href="https://fonts.bunny.net" crossorigin />
    <link rel="stylesheet" href="https://fonts.bunny.net/css?family=inter:400,500,600,700&display=swap" />
    <link rel="stylesheet" href="/styles/{{ css_file }}" />
    <script type="importmap">
      {{ js_importmap | tojson }}
    </script>
  </head>
  <body>
    <header>
      <div class="sm-fullwidth lg-mr-1 filter-wrapper">
        <svg class="filter-icon icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21 21-4.34-4.34"/><circle cx="11" cy="11" r="8"/></svg>
        <input type="search" placeholder="Filter sounds…" aria-label="Filter sounds" />
        <button type="button" id="clear-filter" class="clear-filter" hidden aria-label="Clear filter">
          <svg class="icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
        </button>
      </div>
      <div class="sm-fullwidth lg-mr-1 sort-wrapper">
        <select id="sort" aria-label="Sort by">
          <option value="date">Date added</option>
          <option value="count">Play count</option>
          <option value="alpha">Alphabetical</option>
        </select>
        <button
          type="button"
          id="sort-order"
          class="sort-order"
          data-order="desc"
          title="Sort direction (descending)"
          aria-label="Sort direction"
        >
          <svg class="icon sort-order-desc" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 16 4 4 4-4"/><path d="M7 20V4"/><path d="M11 4h4"/><path d="M11 8h7"/><path d="M11 12h10"/></svg>
          <svg class="icon sort-order-asc" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 8 4-4 4 4"/><path d="M7 4v16"/><path d="M11 12h4"/><path d="M11 16h7"/><path d="M11 20h10"/></svg>
        </button>
      </div>
      <button
        type="button"
        id="group-members-toggle"
        class="icon-toggle"
        data-state="hidden"
        title="Show group members"
        aria-label="Show group members"
        aria-pressed="false"
      >
        <svg class="icon members-icon-hidden" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.733 5.076a10.744 10.744 0 0 1 11.205 6.575 1 1 0 0 1 0 .696 10.747 10.747 0 0 1-1.444 2.49"/><path d="M14.084 14.158a3 3 0 0 1-4.242-4.242"/><path d="M17.479 17.499a10.75 10.75 0 0 1-15.417-5.151 1 1 0 0 1 0-.696 10.75 10.75 0 0 1 4.446-5.143"/><path d="m2 2 20 20"/></svg>
        <svg class="icon members-icon-shown" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/></svg>
      </button>

      <div class="bottom-controls">
        <div class="play-mode lg-mr-1" role="group" aria-label="Play mode">
          <button type="button" id="play-mode-single" class="play-mode-option" data-mode="single" aria-pressed="true" title="Single play — new sounds stop the current one">Single</button>
          <button type="button" id="play-mode-chaos" class="play-mode-option" data-mode="chaos" aria-pressed="false" title="Chaos play — sounds overlap">Chaos</button>
        </div>
        <div class="sm-fullwidth lg-mr-1 volume-wrapper" aria-label="Volume">
          <svg class="volume-icon icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4.702a.705.705 0 0 0-1.203-.498L6.413 7.587A1.4 1.4 0 0 1 5.416 8H3a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h2.416a1.4 1.4 0 0 1 .997.413l3.383 3.384A.705.705 0 0 0 11 19.298z"/><path d="M16 9a5 5 0 0 1 0 6"/><path d="M19.364 18.364a9 9 0 0 0 0-12.728"/></svg>
          <input
            class="sm-fullwidth"
            type="range"
            id="volume"
            min="0"
            max="400"
            value="100"
            aria-label="Volume"
          />
        </div>
        <button id="stop" title="Stop all sounds" aria-label="Stop all sounds">
          <svg class="icon" aria-hidden="true" viewBox="0 0 24 24" fill="currentColor"><rect x="5" y="5" width="14" height="14" rx="2"/></svg>
        </button>
      </div>
    </header>
    <soundboard-app>
      <div class="grid"></div>
      <footer class="error delay-2s" id="app-error">
        &#x26A0; the soundboard doesn't feel like loading today :c
      </footer>

      <footer class="fade-in no-display" id="app-info"></footer>

      <noscript>
        <footer class="error">
          &#x26A0; pls enable uwuscript to use the soundboard owo
        </footer>
      </noscript>
    </soundboard-app>

    <script type="module">
      import "ui";
    </script>
  </body>
</html>
